services:
  # Base de datos PostgreSQL
  - type: pserv
    name: transporte-db
    env: docker
    plan: free
    region: oregon
    ipAllowList: []
    databases:
      - name: transporte_db
        user: transporte_user

  # API NestJS
  - type: web
    name: transporte-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && npm run prisma:deploy
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: transporte-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VERIFICATION_TOKEN_EXPIRATION
        value: 24
      - key: PASSWORD_RESET_TOKEN_EXPIRATION
        value: 2
      - key: REACTIVATION_TOKEN_EXPIRATION
        value: 48
    healthCheckPath: /api
